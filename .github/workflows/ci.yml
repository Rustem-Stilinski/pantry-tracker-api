name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests (H2)
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  smoke:
    name: Smoke test on PostgreSQL
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: usedlog
          POSTGRES_USER: usedlog
          POSTGRES_PASSWORD: usedlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usedlog -d usedlog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package
        run: mvn -B -ntp -DskipTests package

      - name: Start the API
        run: |
          java -jar target/used-items-log-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health > /dev/null; then echo "API is up"; exit 0; fi
            sleep 2
          done
          echo "API did not start"; exit 1

      - name: Run the smoke test
        run: ./ci/smoke-test.sh

      - name: API log
        if: always()
        run: cat app.log

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pantry-tracker-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
