# Tests run against in-memory H2 in PostgreSQL mode, so they need no database server.
spring:
  # MockMvc tests carry their session as a MockHttpSession, so they use plain in-memory sessions.
  # The PostgreSQL smoke test in CI covers sessions stored in the database, including across a restart.
  autoconfigure:
    exclude: org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
  datasource:
    url: jdbc:h2:mem:usedlog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

# No calls to Open Food Facts from tests; tests that need a suggestion replace ProductLookup.
app:
  barcodes:
    lookup-url: ""
