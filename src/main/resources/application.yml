spring:
  application:
    name: used-items-log
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/usedlog}
    username: ${DATABASE_USERNAME:usedlog}
    password: ${DATABASE_PASSWORD:usedlog}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration).
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Up to 4 receipt photos per request (the web app shrinks them first).
      max-file-size: 8MB
      max-request-size: 34MB

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        # Set COOKIE_SECURE=true when the site is served over HTTPS.
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  receipts:
    # Reading receipt photos uses the Claude API. Leave the key empty to offer manual entry only.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
    api-url: ${ANTHROPIC_API_URL:https://api.anthropic.com}
