spring:
  application:
    name: used-items-log
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/usedlog}
    username: ${DATABASE_USERNAME:usedlog}
    password: ${DATABASE_PASSWORD:usedlog}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration).
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        # Set COOKIE_SECURE=true when the site is served over HTTPS.
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
